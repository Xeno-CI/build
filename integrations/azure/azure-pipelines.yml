trigger:
  branches:
    include:
      - "*"

pr:
  branches:
    include:
      - "*"

pool:
  vmImage: ubuntu-latest

variables:
  XENOCI_API_URL: https://xenoci.com

steps:
  - bash: |
      curl -fsSL https://github.com/Xeno-CI/xenocast/releases/latest/download/install.sh | XENOCI_INSTALL_DIR="$HOME/.local/bin" sh
      echo "##vso[task.prependpath]$HOME/.local/bin"
    displayName: Install XenoCast
  - bash: bash integrations/azure/run.sh
    displayName: Submit and wait for XenoCI build
    env:
      XENOCI_API_KEY: $(XENOCI_API_KEY)
      XENOCI_API_URL: $(XENOCI_API_URL)
      BUILD_SOURCESDIRECTORY: $(Build.SourcesDirectory)
      BUILD_REPOSITORY_NAME: $(Build.Repository.Name)
      BUILD_SOURCEVERSION: $(Build.SourceVersion)
      SYSTEM_PULLREQUEST_PULLREQUESTNUMBER: $(System.PullRequest.PullRequestNumber)
