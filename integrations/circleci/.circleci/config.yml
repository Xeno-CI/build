version: 2.1

jobs:
  xenoci-build:
    docker:
      - image: cimg/base:stable
    steps:
      - checkout
      - run:
          name: Install XenoCast
          command: |
            curl -fsSL https://github.com/Xeno-CI/xenocast/releases/latest/download/install.sh | XENOCI_INSTALL_DIR="$HOME/.local/bin" sh
            echo 'export PATH="$HOME/.local/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Build on XenoCI
          command: bash integrations/circleci/run.sh

workflows:
  build:
    jobs:
      - xenoci-build
