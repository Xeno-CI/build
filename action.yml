name: XenoCI 빌드
description: XenoCI 임대 macOS VM에서 빌드를 실행합니다 (빌드 전용 CI 토큰, GitHub App 설치 불필요)
inputs:
  token:
    description: 빌드 전용 CI 토큰 (시크릿 XENOCAST_TOKEN). xenocast token --ci 로 만듭니다. 서명·주문·연장은 되지 않습니다.
    required: false
  api-key:
    description: 종료되었습니다. token(시크릿 XENOCAST_TOKEN)을 쓰세요.
    required: false
    deprecationMessage: API 키는 종료되었습니다. xenocast token --ci --raw | gh secret set XENOCAST_TOKEN 으로 CI 토큰을 만들고 token에 secrets.XENOCAST_TOKEN 을 넘기세요. https://github.com/Xeno-CI/xenocast/blob/main/SETUP.md
  script:
    description: 빌드 스크립트 파일 경로 (저장소 기준)
    required: true
  source:
    description: "git(기본, 이 잡의 임시 토큰으로 VM이 직접 shallow clone) 또는 upload(체크아웃한 작업 폴더를 업로드)"
    default: git
  xcode:
    description: Xcode 버전
    required: false
    default: ''
  timeout:
    description: 제한 시간(분)
    default: '30'
  priority:
    description: 우선순위(normal 또는 high)
    default: normal
  api-url:
    description: API 주소
    default: https://xenoci.com
  github-status:
    description: "true면 이 커밋에 GitHub 커밋 상태(XenoCI: 대기·성공·실패)를 남깁니다. 워크플로에 permissions: statuses: write 필요"
    default: 'false'
  notify-url:
    description: 빌드가 멈추거나 끝나면 서명된 POST를 받을 https URL (Slack·Discord 웹훅 URL 가능)
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        XENOCAST_TOKEN: ${{ inputs.token }}
        XENOCI_API_KEY: ${{ inputs.api-key }}
        XENOCI_API_URL: ${{ inputs.api-url }}
        # The job's own GITHUB_TOKEN: read access to this repository only, expires when the job ends.
        # XenoCI keeps it in memory for this build, never stores or logs it, and the VM deletes it after the fetch.
        XENO_GITHUB_TOKEN: ${{ github.token }}
        XENO_SOURCE: ${{ inputs.source }}
        XENO_SCRIPT: ${{ inputs.script }}
        XENO_XCODE: ${{ inputs.xcode }}
        XENO_TIMEOUT: ${{ inputs.timeout }}
        XENO_PRIORITY: ${{ inputs.priority }}
        XENO_REPO: ${{ github.repository }}
        # On a pull request github.sha is GitHub's temporary merge commit; build and record the PR's own head commit
        # so the build can be found by PR number and commit (GET /api/ci/v1/builds?pr=N).
        XENO_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        XENO_PR: ${{ github.event.pull_request.number }}
        # merge_group runs carry no pull_request; the queue branch names the PR: refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>.
        XENO_MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        XENO_ACTION_PATH: ${{ github.action_path }}
        XENO_GITHUB_STATUS: ${{ inputs.github-status }}
        XENO_NOTIFY_URL: ${{ inputs.notify-url }}
      run: |
        if [ -n "$XENOCI_API_KEY" ]; then echo "::error title=XenoCI API 키 종료::API 키는 종료되었습니다: xenocast token --ci --raw | gh secret set XENOCAST_TOKEN 으로 CI 토큰을 만들어 XENOCAST_TOKEN 시크릿에 넣고, with: token 에 secrets.XENOCAST_TOKEN 을 넘기세요. https://github.com/Xeno-CI/xenocast/blob/main/SETUP.md"; exit 1; fi
        if [ -z "$XENOCAST_TOKEN" ]; then echo "::error title=XenoCI CI 토큰 없음::token 입력이 비어 있습니다. 로그인한 컴퓨터에서 xenocast token --ci --raw | gh secret set XENOCAST_TOKEN 으로 빌드 전용 CI 토큰을 만들고 with: token 에 secrets.XENOCAST_TOKEN 을 넘기세요. https://github.com/Xeno-CI/xenocast/blob/main/SETUP.md"; exit 1; fi
        if [ "$XENO_SOURCE" != git ] && [ "$XENO_SOURCE" != upload ]; then echo "::error title=XenoCI source 값 오류::source는 git 또는 upload입니다 (받은 값: $XENO_SOURCE)"; exit 1; fi
        echo "::add-mask::$XENO_GITHUB_TOKEN"
        args=(build --script "$XENO_SCRIPT" --timeout "$XENO_TIMEOUT" --priority "$XENO_PRIORITY" --wait --commit "$XENO_REF")
        if [ -z "$XENO_PR" ] && [[ "$XENO_MERGE_GROUP_REF" =~ /gh-readonly-queue/.+/pr-([1-9][0-9]*)-[0-9a-f]+$ ]]; then XENO_PR="${BASH_REMATCH[1]}"; fi
        if [ -n "$XENO_PR" ]; then args+=(--pr "$XENO_PR"); fi
        # upload: the repo name only labels the build (the Mac gets the uploaded folder, not a clone).
        if [ "$XENO_SOURCE" = upload ]; then args+=(--dir "${GITHUB_WORKSPACE:-.}" --repo "$XENO_REPO");
        else args+=(--repo "$XENO_REPO" --ref "$XENO_REF" --github-token-env XENO_GITHUB_TOKEN); fi
        if [ -n "$XENO_XCODE" ]; then args+=(--xcode "$XENO_XCODE"); fi
        # The job token posts the commit status; with source: git it is the same token the Mac clones with.
        if [ "$XENO_GITHUB_STATUS" = true ]; then args+=(--github-status-token-env XENO_GITHUB_TOKEN); fi
        if [ -n "$XENO_NOTIFY_URL" ]; then args+=(--notify "$XENO_NOTIFY_URL"); fi
        # Exchange the build-only CI token in this shell. Mask it and the ephemeral access token.
        # XENOCAST_TOKEN stays the CI token: the CLI exchanges it again and never writes a credential store.
        echo "::add-mask::$XENOCAST_TOKEN"
        if ! xenocast_refresh="$(curl --silent --show-error --fail-with-body -X POST "$XENOCI_API_URL/api/ci/v1/session/refresh" -H 'Content-Type: application/json' --data "$(jq -nc --arg refresh "$XENOCAST_TOKEN" '{refresh_token:$refresh}')")"; then echo "::error title=XenoCI CI 토큰 교환 실패::POST /api/ci/v1/session/refresh 가 거절했습니다. 토큰이 폐기됐거나 만료됐으면 xenocast token --ci 로 다시 만드세요."; exit 1; fi
        if ! xenocast_access="$(printf '%s' "$xenocast_refresh" | jq -er '.access_token')"; then echo "::error title=XenoCI CI 토큰 교환 실패::응답에 access_token이 없습니다."; exit 1; fi
        echo "::add-mask::$xenocast_access"
        unset xenocast_refresh xenocast_access
        # exec: on a cancelled job the runner signals only this step's own process (SIGINT, then SIGTERM, then kills the
        # tree). Without exec that is bash, which waits on node and never passes the signal on, so the CLI could not cancel
        # the build and the Mac stayed busy until the timeout. Nothing may follow this line; node's exit code is the step's.
        exec node "$XENO_ACTION_PATH/dist/xenoci.mjs" "${args[@]}"
