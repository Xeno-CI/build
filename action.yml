name: XenoCI 빌드
description: XenoCI 임대 macOS VM에서 빌드를 실행합니다 (API 키 하나, GitHub App 설치 불필요)
inputs:
  api-key:
    description: XenoCI API 키 (조직 시크릿 XENOCI_API_KEY 권장)
    required: true
  script:
    description: 빌드 스크립트 파일 경로 (저장소 기준)
    required: true
  source:
    description: "git(기본, 이 잡의 임시 토큰으로 VM이 직접 shallow clone) 또는 upload(체크아웃한 작업 폴더를 업로드)"
    default: git
  xcode:
    description: Xcode 버전
    required: false
    default: ''
  timeout:
    description: 제한 시간(분)
    default: '30'
  priority:
    description: 우선순위(normal 또는 high)
    default: normal
  api-url:
    description: API 주소
    default: https://xenoci.com
runs:
  using: composite
  steps:
    - shell: bash
      env:
        XENOCI_API_KEY: ${{ inputs.api-key }}
        XENOCI_API_URL: ${{ inputs.api-url }}
        # The job's own GITHUB_TOKEN: read access to this repository only, expires when the job ends.
        # XenoCI keeps it in memory for this build, never stores or logs it, and the VM deletes it after the fetch.
        XENO_GITHUB_TOKEN: ${{ github.token }}
        XENO_SOURCE: ${{ inputs.source }}
        XENO_SCRIPT: ${{ inputs.script }}
        XENO_XCODE: ${{ inputs.xcode }}
        XENO_TIMEOUT: ${{ inputs.timeout }}
        XENO_PRIORITY: ${{ inputs.priority }}
        XENO_REPO: ${{ github.repository }}
        # On a pull request github.sha is GitHub's temporary merge commit; build and record the PR's own head commit
        # so the build can be found by PR number and commit (GET /api/ci/v1/builds?pr=N).
        XENO_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        XENO_PR: ${{ github.event.pull_request.number }}
        # merge_group runs carry no pull_request; the queue branch names the PR: refs/heads/gh-readonly-queue/<base>/pr-<N>-<sha>.
        XENO_MERGE_GROUP_REF: ${{ github.event.merge_group.head_ref }}
        XENO_ACTION_PATH: ${{ github.action_path }}
      run: |
        if [ -z "$XENOCI_API_KEY" ]; then echo "::error title=XenoCI API 키 없음::api-key 입력이 비어 있습니다. https://xenoci.com/app/api-keys 에서 키를 만들고 저장소(또는 조직) 시크릿 XENOCI_API_KEY에 넣은 뒤 워크플로의 with: api-key 에 secrets.XENOCI_API_KEY 를 넘겨 주세요."; exit 1; fi
        if [ "$XENO_SOURCE" != git ] && [ "$XENO_SOURCE" != upload ]; then echo "::error title=XenoCI source 값 오류::source는 git 또는 upload입니다 (받은 값: $XENO_SOURCE)"; exit 1; fi
        echo "::add-mask::$XENO_GITHUB_TOKEN"
        args=(build --script "$XENO_SCRIPT" --timeout "$XENO_TIMEOUT" --priority "$XENO_PRIORITY" --wait --commit "$XENO_REF")
        if [ -z "$XENO_PR" ] && [[ "$XENO_MERGE_GROUP_REF" =~ /gh-readonly-queue/.+/pr-([1-9][0-9]*)-[0-9a-f]+$ ]]; then XENO_PR="${BASH_REMATCH[1]}"; fi
        if [ -n "$XENO_PR" ]; then args+=(--pr "$XENO_PR"); fi
        # upload: the repo name only labels the build (the Mac gets the uploaded folder, not a clone).
        if [ "$XENO_SOURCE" = upload ]; then args+=(--dir "${GITHUB_WORKSPACE:-.}" --repo "$XENO_REPO");
        else args+=(--repo "$XENO_REPO" --ref "$XENO_REF" --github-token-env XENO_GITHUB_TOKEN); fi
        if [ -n "$XENO_XCODE" ]; then args+=(--xcode "$XENO_XCODE"); fi
        # exec: on a cancelled job the runner signals only this step's own process (SIGINT, then SIGTERM, then kills the
        # tree). Without exec that is bash, which waits on node and never passes the signal on, so the CLI could not cancel
        # the build and the Mac stayed busy until the timeout. Nothing may follow this line; node's exit code is the step's.
        exec node "$XENO_ACTION_PATH/dist/xenoci.mjs" "${args[@]}"
