name: XenoCI 빌드
description: XenoCI macOS VM에서 빌드를 실행합니다 (콘솔에서 발급한 API 키 하나, GitHub App 설치 불필요)
inputs:
  api-key:
    description: "XenoCI API 키(xci_live_…, 저장소 시크릿 XENOCI_API_KEY). 콘솔에서 발급합니다. 잡은 조직 잔액(USD)에서 과금합니다"
    required: true
  script:
    description: 빌드 스크립트 파일 경로 (저장소 기준)
    required: true
  source:
    description: "upload(기본, 체크아웃한 작업 폴더를 업로드) 또는 git(VM이 https://github.com/<owner>/<name>.git 을 직접 받음, 공개 저장소만)"
    default: upload
  xcode:
    description: Xcode 버전
    required: false
    default: ''
  timeout:
    description: 제한 시간(분)
    default: '30'
  artifacts:
    description: "모을 결과물 경로(쉼표로 구분, 예: build/*.ipa)"
    default: ''
  api-url:
    description: API 주소
    default: https://xenoci.com
runs:
  using: composite
  steps:
    - shell: bash
      env:
        XENOCI_API_KEY: ${{ inputs.api-key }}
        XENOCI_API_URL: ${{ inputs.api-url }}
        XENOCI_SOURCE_KIND: github_action
        XENO_ARTIFACTS: ${{ inputs.artifacts }}
        XENO_SOURCE: ${{ inputs.source }}
        XENO_SCRIPT: ${{ inputs.script }}
        XENO_XCODE: ${{ inputs.xcode }}
        XENO_TIMEOUT: ${{ inputs.timeout }}
        XENO_REPO: ${{ github.repository }}
        # On a pull request github.sha is GitHub's temporary merge commit; build the PR's own head commit.
        XENO_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        XENO_ACTION_PATH: ${{ github.action_path }}
      run: |
        # One credential: the console API key (xci_live_…). The CLI sends it as Authorization: Bearer to /api/runner/v1;
        # there is no token exchange. The key is masked before anything else can print it.
        if [ -n "$XENOCI_API_KEY" ]; then echo "::add-mask::$XENOCI_API_KEY"; fi
        if [ -z "$XENOCI_API_KEY" ]; then echo "::error title=XenoCI API 키 없음::api-key 입력이 비어 있습니다. 콘솔 https://xenoci.com/console 에서 API 키를 발급해 저장소 시크릿 XENOCI_API_KEY 에 넣고 with: api-key 에 secrets.XENOCI_API_KEY 를 넘기세요"; exit 1; fi
        if [[ "$XENOCI_API_KEY" != xci_live_* ]]; then echo "::error title=XenoCI API 키 형식 오류::api-key 는 콘솔에서 발급한 xci_live_ 로 시작하는 키입니다. 옛 형식 키는 쓸 수 없습니다. 콘솔 https://xenoci.com/console 에서 새 키를 발급해 시크릿 XENOCI_API_KEY 를 바꾸세요"; exit 1; fi
        if [ -z "$XENO_SOURCE" ]; then XENO_SOURCE=upload; fi
        if [ "$XENO_SOURCE" != git ] && [ "$XENO_SOURCE" != upload ]; then echo "::error title=XenoCI source 값 오류::source는 git 또는 upload입니다 (받은 값: $XENO_SOURCE)"; exit 1; fi
        args=(build --script "$XENO_SCRIPT" --timeout "$XENO_TIMEOUT" --repo "$XENO_REPO")
        if [ "$XENO_SOURCE" = upload ]; then args+=(--dir "${GITHUB_WORKSPACE:-.}"); else args+=(--ref "$XENO_REF"); fi
        if [ -n "$XENO_XCODE" ]; then args+=(--xcode "$XENO_XCODE"); fi
        if [ -n "$XENO_ARTIFACTS" ]; then args+=(--artifacts "$XENO_ARTIFACTS"); fi
        # exec: on a cancelled job the runner signals only this step's own process (SIGINT, then SIGTERM, then kills the
        # tree). Without exec that is bash, which waits on node and never passes the signal on, so the CLI could not cancel
        # the job and the VM stayed busy until the timeout. Nothing may follow this line; node's exit code is the step's.
        exec node "$XENO_ACTION_PATH/dist/xenoci.mjs" "${args[@]}"
